name: CI

on:
  push:
    branches: [main, master, feature/integrated-ai-agents, fix/bearer-auth-swagger]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./ci_test.db
          GOOGLE_API_KEY: ""
          GEMINI_API_KEY: ""
        run: python -m pytest -q -W error::starlette.exceptions.StarletteDeprecationWarning

  frontend-build:
    name: Frontend TypeScript and Vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontEnd
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build
